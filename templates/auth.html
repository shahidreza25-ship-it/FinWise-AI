<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinWise AI - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #123b35);
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            background: #1c2938;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #50e3a4;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #bdc9d5;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #465668;
            border-radius: 8px;
            background: #111c29;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #50e3a4;
            color: #10251f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #35cb8c;
        }

        .footer {
            margin-top: 22px;
            font-size: 13px;
            color: #aab7c5;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>FinWise AI</h1>
        <p>Your personal finance companion</p>

        <form method="POST">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Manage your money smarter with FinWise AI.
        </div>
    </div>
</body>
</html>
